<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#131525"><title>MoodCraft · تجربة الصوت الجديدة</title><style>body{font:16px system-ui,Tahoma;background:linear-gradient(140deg,#121522,#25213a);color:#f7f0e5;max-width:750px;margin:auto;padding:25px;min-height:100vh}h1{color:#e7c88e}p,small{color:#c5c1d0;line-height:1.8}.panel{background:#ffffff0d;border:1px solid #ffffff22;border-radius:18px;padding:22px;margin:16px 0}label{display:block;margin:18px 0 7px}select,button{font:inherit;border:0;border-radius:10px;padding:13px;width:100%;background:#34354b;color:white}button{background:#e7c88e;color:#181521;font-weight:700;margin-top:20px}button:disabled{opacity:.5}audio{width:100%;margin-top:14px}a{color:#e7c88e}#status{min-height:30px}</style><h1>♫ MoodCraft Studio — v0.4.1 Mobile Fix</h1><p>تجربة مستقلة لمحرك مجاني مُحسّن: تأليف بجمل موسيقية، طبقات بيانو وأوتار، مساحة صوتية، ونهاية متدرجة. ليست نموذج AI توليديًا.</p><div class="panel"><label>النمط</label><select id="style"><option value="cinema">سينمائي فاخر · Luxury Cinematic</option><option value="strings">وتريات هادئة · Warm Strings</option><option value="piano">بيانو تأملي · Felt Piano</option></select><label>المدة</label><select id="duration"><option value="15">15 ثانية</option><option value="30" selected>30 ثانية</option><option value="45">45 ثانية</option></select><button id="go">توليد مقطوعة تجريبية</button><p id="status" role="status"></p><div id="result"></div></div><small>توليد محلي دون اشتراك أو API. الآلات مُحاكاة رقميًا، وليست تسجيلات أوركسترا حقيقية. جودة النتيجة تجريبية.</small><p><a href="./">العودة للنسخة الحالية</a></p><script>
const $=x=>document.getElementById(x);let last=null;
function rng(s){return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296}}
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function wave(s,sr,t,d,f,a,type,pan){let st=Math.floor(t*sr),end=Math.min(s[0].length,Math.floor((t+d)*sr));for(let i=st;i<end;i++){let u=(i-st)/sr,env;if(type==='piano')env=(1-Math.exp(-u*55))*Math.exp(-u*2.4)*Math.min(1,(d-u)*8);else env=Math.min(1,u/.42)*Math.min(1,(d-u)/.5)*(.75+.25*Math.sin(u*2));if(env<=0)continue;let ph=2*Math.PI*f*u,v;if(type==='piano'){v=Math.sin(ph)+.3*Math.sin(ph*2.002)*Math.exp(-u*4)+.11*Math.sin(ph*3.005)*Math.exp(-u*7)+.035*Math.sin(ph*4.01)*Math.exp(-u*11)}else{v=.72*Math.sin(ph)+.23*Math.sin(ph*2)+.12*Math.sin(ph*3)+.07*Math.sin(ph*4);v*=.95+.05*Math.sin(u*5)}let z=a*env*v;s[0][i]+=z*(1-pan)*.5;s[1][i]+=z*(1+pan)*.5}}
function encode(ch,sr){let n=ch[0].length,buf=new ArrayBuffer(44+n*4),v=new DataView(buf),write=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};write(0,'RIFF');v.setUint32(4,36+n*4,true);write(8,'WAVE');write(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,sr,true);v.setUint32(28,sr*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);write(36,'data');v.setUint32(40,n*4,true);for(let i=0;i<n;i++)for(let c=0;c<2;c++)v.setInt16(44+i*4+c*2,Math.max(-32767,Math.min(32767,Math.round(ch[c][i]*32767))),true);return new Blob([buf],{type:'audio/wav'})}
function render(style,sec,seed){let sr=22050,N=sec*sr,ch=[new Float32Array(N),new Float32Array(N)],r=rng(seed),bpm=style==='strings'?72:style==='piano'?68:78,beat=60/bpm;let progressions=[[0,3,7,10],[0,5,8,3],[0,7,3,5]],prog=progressions[Math.floor(r()*progressions.length)],root=style==='strings'?50:48,mode=[0,2,3,5,7,8,10],bars=Math.ceil(sec/(beat*4)),motif=[0,2,4,2,3,1,2,0];for(let bar=0;bar<bars;bar++){let t=bar*beat*4,chord=prog[bar%4],notes=[chord,chord+3,chord+7];for(let j=0;j<3;j++)wave(ch,sr,t,Math.min(beat*4.1,sec-t),hz(root+notes[j]),style==='strings'?.045:.029,'string',[-.6,0,.6][j]);wave(ch,sr,t,Math.min(beat*3.8,sec-t),hz(root-12+chord),.034,'string',0);for(let k=0;k<4;k++){let at=t+k*beat;if(at>=sec)continue;let note=mode[(motif[(bar*4+k)%8]+(bar%4))%7],oct=(bar%4===2?12:0),dur=Math.min(beat*(k===3?1.4:.82),sec-at);wave(ch,sr,at,dur,hz(root+12+note+oct),style==='strings'?.025:.061,style==='strings'?'string':'piano',k%2?-.35:.35);if(style==='cinema'&&k===0)wave(ch,sr,at,Math.min(beat*2.6,sec-at),hz(root+24+note),.014,'piano',-.25)}}}
let dry=ch.map(a=>a.slice());let taps=[[.09,.12],[.19,.075],[.32,.055],[.49,.035]];for(let i=0;i<N;i++){for(let [delay,gain] of taps){let d=Math.round(delay*sr);if(i>=d){ch[0][i]+=dry[1][i-d]*gain;ch[1][i]+=dry[0][i-d]*gain}}let fade=Math.min(1,i/(sr*.6),(N-i)/(sr*2.2));ch[0][i]*=Math.max(0,fade);ch[1][i]*=Math.max(0,fade)}let peak=0;for(let i=0;i<N;i++)peak=Math.max(peak,Math.abs(ch[0][i]),Math.abs(ch[1][i]));let gain=Math.min(1,.83/Math.max(.001,peak));for(let i=0;i<N;i++){ch[0][i]*=gain;ch[1][i]*=gain}return encode(ch,sr)}
$('go').onclick=async()=>{let btn=$('go');btn.disabled=true;$('status').textContent='جارٍ التأليف والتصدير...';await new Promise(r=>setTimeout(r,40));try{let style=$('style').value,seconds=+$('duration').value,seed=Math.floor(Math.random()*2147483647),blob=render(style,seconds,seed);if(last)URL.revokeObjectURL(last);last=URL.createObjectURL(blob);$('result').innerHTML='';let audio=document.createElement('audio');audio.controls=true;audio.src=last;let link=document.createElement('a');link.href=last;link.download='MoodCraft-v04-'+style+'-'+seed+'.wav';link.textContent='تنزيل WAV';$('result').append(audio,document.createElement('p'),link);$('status').textContent='جاهزة للاستماع والمقارنة'}catch(e){$('status').textContent='حدث خطأ: '+e.message}finally{btn.disabled=false}};
</script></html>
